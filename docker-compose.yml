services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD não configurada}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME não configurado}
      MYSQL_USER: ${DB_USER:?DB_USER não configurado}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não configurada}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - --password=${DB_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data: